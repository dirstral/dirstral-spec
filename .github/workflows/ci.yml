name: Spec CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          test -f docs/SPEC.md
          test -f docs/ECOSYSTEM.md
          test -f docs/x402-payment-adapter-spec.md
          test -f spec/versioning.md
          test -f spec/tools/schemas.md
          test -f spec/errors/taxonomy.md
  version-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The SPEC.md version header matches the single source
        run: |
          # spec/versioning.md calls itself the single source for the current
          # spec version, and SPEC.md repeats the value for offline readers.
          # Nothing compared the two, so SPEC.md sat at 0.47.1 while the source
          # said 0.67.2: twenty minors of drift in the document a reader opens
          # first (dirstral-spec#113). This job closes that.
          python3 - <<'PY'
          import re, sys

          def one(path, pattern, what):
              try:
                  text = open(path, encoding="utf-8").read()
              except OSError as exc:
                  print(f"::error file={path}::cannot read: {exc}")
                  sys.exit(1)
              found = re.findall(pattern, text, re.MULTILINE)
              if len(found) != 1:
                  print(f"::error file={path}::expected exactly one {what}, "
                        f"found {len(found)}: {found}")
                  sys.exit(1)
              return found[0]

          source = one("spec/versioning.md",
                       r"^\*\*Current spec version:\*\* `([0-9]+\.[0-9]+\.[0-9]+)`",
                       "'Current spec version' line")
          header = one("docs/SPEC.md",
                       r"^\*\*Spec version:\*\* `([0-9]+\.[0-9]+\.[0-9]+)`",
                       "'Spec version' line")

          print(f"spec/versioning.md: {source}")
          print(f"docs/SPEC.md:       {header}")
          if source != header:
              print(f"::error file=docs/SPEC.md::SPEC.md declares {header} but "
                    f"spec/versioning.md, the single source, says {source}. "
                    f"A version bump must update both (dirstral-spec#113).")
              sys.exit(1)
          print(f"version header matches the single source: {source}")
          PY

  schema-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool schemas parse, and the index matches the directory
        run: |
          fail=0

          # Every contract document must parse.
          for f in spec/tools/schemas/*.json; do
            if ! python3 -m json.tool "$f" >/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done

          # Every tool schema must be linked exactly once from the index.
          # common.json is the shared Span/Hit/Citation definitions file, not a
          # tool, so it carries no row.
          for f in spec/tools/schemas/*.json; do
            base=$(basename "$f")
            if [ "$base" = "common.json" ]; then continue; fi
            # grep -o, not grep -c: -c counts matching LINES, so two links on
            # one line would read as one and a duplicate row would pass.
            n=$(grep -o -F "(schemas/$base)" spec/tools/schemas.md | wc -l | tr -d "[:space:]")
            if [ "$n" != "1" ]; then
              echo "::error file=spec/tools/schemas.md::schemas/$base is linked $n time(s); expected exactly 1 (dirstral-spec#74)"
              fail=1
            fi
          done

          # Every file the index links must exist.
          linked=$(grep -oE '\(schemas/[A-Za-z0-9_.-]+\.json\)' spec/tools/schemas.md | tr -d '()' | sort -u || true)
          for rel in $linked; do
            if [ ! -f "spec/tools/$rel" ]; then
              echo "::error file=spec/tools/schemas.md::links missing file $rel"
              fail=1
            fi
          done

          exit $fail
      - name: Every tool schema uses the documented input/output wrapper
        run: |
          # spec/tools/schemas.md says each per-tool document has two top-level
          # sections, input and output, and that a generic validator loads those
          # explicitly. Three files shipped a legacy shape instead, with the root
          # object as the input schema and the output under definitions.output,
          # so a consumer following the documented rule could not load them at
          # all (dirstral-spec#75). Nothing compared the files to the rule.
          python3 - <<'PY'
          import glob, json, sys

          # common.json is the shared Span/Hit/Citation document, not a tool, so
          # it carries definitions and no input/output pair.
          SHARED = "spec/tools/schemas/common.json"

          files = sorted(glob.glob("spec/tools/schemas/*.json"))
          if not files:
              print("::error::no tool schemas found under spec/tools/schemas/")
              sys.exit(1)

          bad = checked = 0
          for path in files:
              if path == SHARED:
                  continue
              try:
                  doc = json.load(open(path, encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  print(f"::error file={path}::cannot parse: {exc}")
                  bad += 1
                  continue
              checked += 1
              missing = [k for k in ("input", "output") if k not in doc]
              if missing:
                  print(f"::error file={path}::missing top-level "
                        f"{', '.join(missing)}. Every per-tool schema declares "
                        f"input and output (dirstral-spec#75).")
                  bad += 1
              # Presence is not enough: a scalar or null passes a key check and
              # is still not a schema object.
              for key in ("input", "output"):
                  if key in doc and not isinstance(doc[key], dict):
                      print(f"::error file={path}::top-level {key} is "
                            f"{type(doc[key]).__name__}, expected a schema "
                            f"object (dirstral-spec#75).")
                      bad += 1
              if "output" in doc.get("definitions", {}):
                  print(f"::error file={path}::output belongs at the top level, "
                        f"not under definitions (dirstral-spec#75).")
                  bad += 1

          if not checked:
              print("::error::no per-tool schema was checked; the guard is not "
                    "exercising anything")
              sys.exit(1)
          print(f"input/output wrapper: {checked} tool schema(s) conform")
          sys.exit(1 if bad else 0)
          PY

      - name: list_files fields agree across every copy of the contract
        run: |
          # dir2mcp_list_files is described in three places: the published
          # schema, SPEC.md 15.5, and bs-007. include_hidden was in the schema
          # and in no prose at all, and files[].title was emitted by the server
          # while every canonical copy forbade it via additionalProperties
          # (dirstral-spec#76). Nothing compared the copies.
          python3 - <<'PY'
          import json, re, sys

          SCHEMA = "spec/tools/schemas/list_files.json"
          SPEC = "docs/SPEC.md"
          BS007 = "docs/specs/behavior/bs-007-tool-specifications.md"

          def read(path):
              try:
                  return open(path, encoding="utf-8").read()
              except OSError as exc:
                  print(f"::error file={path}::cannot read: {exc}")
                  sys.exit(1)

          try:
              doc = json.loads(read(SCHEMA))
              inputs = set(doc["input"]["properties"])
              entry = doc["output"]["properties"]["files"]["items"]
              fields = set(entry["properties"])
          except (ValueError, KeyError) as exc:
              print(f"::error file={SCHEMA}::cannot read the list_files "
                    f"contract: {exc}")
              sys.exit(1)

          if not inputs or not fields:
              print(f"::error file={SCHEMA}::empty field set; the check is not "
                    f"exercising anything")
              sys.exit(1)

          # Scope each search to that document's list_files section. Searching
          # a whole file lets a common word like "title" match somewhere else
          # entirely and report parity that does not exist.
          def section(text, start, stop, label):
              m = re.search(start, text, re.M)
              if not m:
                  print(f"::error file={label}::cannot find the list_files "
                        f"section; the check cannot verify anything.")
                  sys.exit(1)
              rest = text[m.end():]
              end = re.search(stop, rest, re.M)
              return rest[: end.start()] if end else rest

          spec = section(read(SPEC), r"^### 15\.5 ", r"^### 15\.", SPEC)
          bs = section(read(BS007), r"^### dir2mcp_list_files$", r"^### ", BS007)

          bad = 0
          for name in sorted(inputs | fields):
              for label, text in ((SPEC, spec), (BS007, bs)):
                  if not re.search(r"\b" + re.escape(name) + r"\b", text):
                      print(f"::error file={label}::the list_files section does "
                            f"not mention field '{name}', which "
                            f"{SCHEMA} declares (dirstral-spec#76).")
                      bad += 1

          print(f"list_files parity: {len(inputs)} input and {len(fields)} "
                f"files[] field(s) present in all three copies")
          sys.exit(1 if bad else 0)
          PY

      - name: answer_source agrees across every answer surface
        run: |
          python3 -m pip install --quiet --disable-pip-version-check jsonschema
          # The whole value of 9.4.5 is that ONE optional field lets a client
          # and a health check tell a generated answer from a published context
          # dump. Three schemas carry it plus an inline copy in SPEC.md, so
          # there are four places for a vocabulary to drift, and a client that
          # routes on a value one surface never emits is back to grepping
          # prose. Nothing compared the copies.
          python3 - <<'PY'
          import json, re, sys

          SCHEMAS = [
              "spec/tools/schemas/ask.json",
              "spec/tools/schemas/ask_audio.json",
              "spec/tools/schemas/transcribe_and_ask.json",
          ]
          SPEC = "docs/SPEC.md"
          BS007 = "docs/specs/behavior/bs-007-tool-specifications.md"
          FIELDS = ("answer_source", "answer_source_reason")

          def read(path):
              try:
                  return open(path, encoding="utf-8").read()
              except OSError as exc:
                  print(f"::error file={path}::cannot read: {exc}")
                  sys.exit(1)

          bad = 0
          vocab = {}
          for path in SCHEMAS:
              try:
                  props = json.loads(read(path))["output"]["properties"]
              except (ValueError, KeyError) as exc:
                  print(f"::error file={path}::cannot read the output "
                        f"properties: {exc}")
                  sys.exit(1)
              for field in FIELDS:
                  if field not in props:
                      print(f"::error file={path}::declares no '{field}'; "
                            f"SPEC 9.4.5 puts it on every answer surface.")
                      bad += 1
                      continue
                  values = tuple(props[field].get("enum", ()))
                  if not values:
                      print(f"::error file={path}::'{field}' declares no enum, "
                            f"so its vocabulary is not closed (SPEC 9.4.5).")
                      bad += 1
                      continue
                  vocab.setdefault(field, {})[path] = values

          for field, byfile in vocab.items():
              distinct = set(byfile.values())
              if len(distinct) > 1:
                  print(f"::error file={SCHEMAS[0]}::'{field}' has "
                        f"{len(distinct)} different vocabularies across the "
                        f"answer surfaces: {byfile}")
                  bad += 1

          # Every value a schema may emit has to be described in the prose that
          # defines it, or an implementer reads the enum and guesses.
          spec = read(SPEC)
          m = re.search(r"^#### 9\.4\.5 ", spec, re.M)
          if not m:
              print(f"::error file={SPEC}::cannot find 9.4.5; the check cannot "
                    f"verify anything.")
              sys.exit(1)
          rest = spec[m.end():]
          end = re.search(r"^#### 9\.|^### 9\.", rest, re.M)
          section = rest[: end.start()] if end else rest

          bs = read(BS007)
          for field, byfile in vocab.items():
              for value in sorted({v for values in byfile.values() for v in values}):
                  if not re.search(r"\b" + re.escape(value) + r"\b", section):
                      print(f"::error file={SPEC}::9.4.5 does not describe "
                            f"'{value}', which the answer schemas may emit.")
                      bad += 1
              if not re.search(r"\b" + re.escape(field) + r"\b", bs):
                  print(f"::error file={BS007}::does not mention '{field}', "
                        f"which the answer schemas declare (SPEC 9.4.5).")
                  bad += 1

          # Properties and vocabularies agreeing is not the contract. 9.4.5
          # PAIRS the fields: retrieval_only requires a reason, and a reason
          # requires retrieval_only. A rule stated only in prose is a rule a
          # generated client ignores, so each schema declares it and each
          # schema is checked against instances that must pass and must fail.
          try:
              import jsonschema
          except ImportError as exc:
              # Fail, never skip. A check that quietly does nothing reports the
              # same green as a check that passed.
              print(f"::error::jsonschema is required to validate 9.4.5 "
                    f"instances and is missing: {exc}")
              sys.exit(1)

          BASE = {
              "question": "q", "answer": "a", "citations": [], "hits": [],
              "indexing_complete": True,
              # transcribe_and_ask requires three more.
              "stt_provider": "p", "transcript_model": "m", "transcribed": True,
          }
          CASES = [
              (True, {}, "neither field"),
              (True, {"answer_source": "generated"}, "generated, no reason"),
              (True, {"answer_source": "retrieval_only",
                      "answer_source_reason": "generator_unavailable"},
               "retrieval_only with a reason"),
              (False, {"answer_source": "retrieval_only"},
               "retrieval_only with NO reason"),
              (False, {"answer_source": "generated",
                       "answer_source_reason": "generator_error"},
               "generated WITH a reason"),
              (False, {"answer_source_reason": "generator_error"},
               "a reason with no source"),
              # Nothing was generated, so there is no answer to verify.
              (True, {"answer_source": "retrieval_only",
                      "answer_source_reason": "generator_unavailable",
                      "faithfulness": "unchecked"},
               "retrieval_only, faithfulness unchecked"),
              (False, {"answer_source": "retrieval_only",
                       "answer_source_reason": "generator_unavailable",
                       "faithfulness": "verified"},
               "retrieval_only claiming a verified answer"),
              (False, {"answer_source": "retrieval_only",
                       "answer_source_reason": "generator_unavailable",
                       "faithfulness": "unsupported"},
               "retrieval_only claiming a withheld answer"),
          ]

          for path in SCHEMAS:
              schema = json.loads(read(path))["output"]
              allowed = set(schema.get("properties", {}))
              for should_pass, extra, label in CASES:
                  instance = {k: v for k, v in BASE.items() if k in allowed}
                  instance.update(extra)
                  try:
                      jsonschema.validate(instance, schema)
                      passed = True
                  except jsonschema.ValidationError:
                      passed = False
                  if passed != should_pass:
                      verb = "accepts" if passed else "rejects"
                      want = "accept" if should_pass else "reject"
                      print(f"::error file={path}::output schema {verb} "
                            f"'{label}'; SPEC 9.4.5 says it must {want} it.")
                      bad += 1

          total = sum(len(v) for v in vocab.values())
          print(f"answer provenance parity: {len(FIELDS)} field(s) on "
                f"{len(SCHEMAS)} answer surface(s), {total} enum(s) agreed and "
                f"described in 9.4.5; {len(CASES)} instance(s) checked per "
                f"surface")
          sys.exit(1 if bad else 0)
          PY

      - name: Document-status descriptions match the canonical enum
        run: |
          fail=0

          # Named regression guard for dirstral-spec#77: stats.json once said
          # doc_counts "groups status='ready' docs". No 'ready' status exists.
          if grep -n "status='ready'" spec/tools/schemas/*.json; then
            echo "::error::a tool schema describes the nonexistent document status 'ready' (dirstral-spec#77)"
            fail=1
          fi

          # General parity: every document status a description names must be a
          # member of the canonical enum. The enum is READ FROM
          # list_files.json, never hardcoded, so prose and schema cannot drift.
          if ! python3 - <<'PY'; then fail=1; fi
          import glob, json, re, sys

          CANON = "spec/tools/schemas/list_files.json"
          MENTION = re.compile(r"status\s*=\s*['\"]([A-Za-z_][A-Za-z0-9_]*)['\"]")

          def walk(node, enums, texts):
              if isinstance(node, dict):
                  for key, val in node.items():
                      if (key == "status" and isinstance(val, dict)
                              and val.get("type") == "string"
                              and isinstance(val.get("enum"), list)):
                          enums.append(tuple(val["enum"]))
                      walk(val, enums, texts)
              elif isinstance(node, list):
                  for item in node:
                      walk(item, enums, texts)
              elif isinstance(node, str):
                  texts.append(node)

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          def die(msg):
              print("::error::" + msg)
              sys.exit(1)

          try:
              enums = []
              walk(load(CANON), enums, [])
          except (OSError, ValueError) as exc:
              die("cannot read the canonical status enum from %s: %s" % (CANON, exc))
          if len(set(enums)) != 1 or not enums[0]:
              die("expected exactly one non-empty document-status enum in %s, found %r"
                  % (CANON, sorted(set(enums))))
          allowed = set(enums[0])
          print("canonical document status enum (%s): %s"
                % (CANON, " | ".join(sorted(allowed))))

          files = sorted(glob.glob("spec/tools/schemas/*.json"))
          if not files:
              die("no tool schemas found under spec/tools/schemas/")

          checked = bad = 0
          for path in files:
              try:
                  texts = []
                  walk(load(path), [], texts)
              except (OSError, ValueError) as exc:
                  print("::error file=%s::cannot parse: %s" % (path, exc))
                  bad += 1
                  continue
              for text in texts:
                  for value in MENTION.findall(text):
                      checked += 1
                      if value not in allowed:
                          print("::error file=%s::description says status='%s', which is "
                                "not in the canonical enum (%s). A schema description "
                                "must not invent a document status (dirstral-spec#77)."
                                % (path, value, " | ".join(sorted(allowed))))
                          bad += 1
          print("checked %d document-status mention(s) across %d schema file(s)"
                % (checked, len(files)))
          if checked == 0:
              die("no document-status mention found to verify; the parity check is "
                  "not exercising anything")
          sys.exit(1 if bad else 0)
          PY

          exit $fail
      - name: stats.json skip_reasons keeps parity with the canonical SPEC.md copy
        run: |
          # dirstral-spec#77: the doc_counts explanation exists in two places,
          # the canonical SPEC.md 15.2 schema block and the machine-readable
          # stats.json. They drifted once. This asserts the claims that matter
          # are present on BOTH sides and the retracted claim is on neither.
          # It does not demand byte equality: the two copies are deliberately
          # worded for different readers, and a byte diff would be brittle.
          python3 - <<'PY'
          import io, json, re, sys

          SPEC = "docs/SPEC.md"
          SCHEMA = "spec/tools/schemas/stats.json"

          REQUIRED = [
              "all non deleted documents",
              "regardless of status",
              "a skipped odt and an extracted docx both count as document",
              "overstates coverage",
              "reports what was not indexed and why",
              "must not read doc counts as an indexed document count",
          ]
          BANNED = ["status ready", "groups status ready"]

          def norm(text):
              return re.sub(r"[^a-z0-9]+", " ", text.lower()).strip()

          def die(msg):
              print("::error::" + msg)
              sys.exit(1)

          def find_desc(node):
              if isinstance(node, dict):
                  for key, val in node.items():
                      if key == "skip_reasons" and isinstance(val, dict):
                          desc = val.get("description")
                          if isinstance(desc, str) and desc:
                              return desc
                      found = find_desc(val)
                      if found:
                          return found
              elif isinstance(node, list):
                  for item in node:
                      found = find_desc(item)
                      if found:
                          return found
              return None

          try:
              spec_text = io.open(SPEC, encoding="utf-8").read()
          except OSError as exc:
              die("cannot read %s: %s" % (SPEC, exc))

          blocks = [b for b in re.findall(r"```json\n(.*?)\n```", spec_text, re.S)
                    if '"skip_reasons"' in b]
          if len(blocks) != 1:
              die("expected exactly one canonical JSON block carrying skip_reasons "
                  "in %s, found %d" % (SPEC, len(blocks)))
          try:
              canon_desc = find_desc(json.loads(blocks[0]))
          except ValueError as exc:
              die("the canonical %s skip_reasons block does not parse: %s" % (SPEC, exc))
          if not canon_desc:
              die("no skip_reasons description in the canonical %s block" % SPEC)

          try:
              schema_desc = find_desc(json.load(io.open(SCHEMA, encoding="utf-8")))
          except (OSError, ValueError) as exc:
              die("cannot read %s: %s" % (SCHEMA, exc))
          if not schema_desc:
              die("no skip_reasons description in %s" % SCHEMA)

          sides = [(SPEC, norm(canon_desc)), (SCHEMA, norm(schema_desc))]
          bad = 0
          for claim in REQUIRED:
              for where, text in sides:
                  if claim not in text:
                      print("::error file=%s::the skip_reasons description has lost "
                            "the required doc_counts claim \"%s\". The canonical "
                            "prose and the machine-readable schema MUST agree "
                            "(dirstral-spec#77)." % (where, claim))
                      bad += 1
          for claim in BANNED:
              for where, text in sides:
                  if claim in text:
                      print("::error file=%s::the skip_reasons description carries "
                            "the retracted claim \"%s\" (dirstral-spec#77)."
                            % (where, claim))
                      bad += 1

          print("skip_reasons doc_counts parity: %d required claim(s) verified on "
                "both %s and %s; %d banned claim(s) absent"
                % (len(REQUIRED), SPEC, SCHEMA, len(BANNED)))
          sys.exit(1 if bad else 0)
          PY
  links-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown link sanity
        run: |
          # grep, not rg: ripgrep is not on the runner image, so `! rg ...`
          # returned 127 -> inverted to success and this gate never ran.
          if grep -rn --include='*.md' -F '](../SPEC.md)' docs spec; then
            echo "::error::Use local relative links from repo root layout: SPEC.md lives at docs/SPEC.md, so '../SPEC.md' from docs/ does not resolve."
            exit 1
          fi
